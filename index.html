  body.seat #brand, body.seat #find, body.seat #ticker, body.seat #tools, body.seat #hint, body.seat #card, body.seat #toast{display:none}
  @media (max-width:720px){

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

// ================= Parametreler =================
const qs = new URLSearchParams(location.search);
const TOTAL = 40000, PREM = 1000, MID = 2000, TRIB = TOTAL - PREM - MID;
// Takipçi listesi sitenin yanındaki takipciler.json'da (veri/guncelle.py günceller ve Cloudflare'a yükler).
// ?n=SAYI verilirse gerçek liste yerine sahte isimlerle test edilir.
const DATA_URL = qs.get('veri') || 'takipciler.json';
const TEST_N = qs.has('n') ? Math.max(0, Math.min(TOTAL, parseInt(qs.get('n'), 10) || 0)) : null;
let REAL = [];
if(TEST_N === null){
  try{
    const r = await fetch(DATA_URL + '?t=' + Math.floor(Date.now()/60000), {cache:'no-store'});
    if(r.ok){ const j = await r.json(); REAL = [...new Set((j.isimler||[]).map(x=>String(x).trim().toLowerCase()).filter(Boolean))].slice(0, TOTAL); }
  }catch(e){ console.warn('Takipçi listesi okunamadı, boş stadyum gösteriliyor.', e); }
}
const N = TEST_N ?? REAL.length;
const HX = 52.5, HZ = 34;
const CORNERS = [[HX,HZ],[HX,-HZ],[-HX,-HZ],[-HX,HZ]];
const fmt = n => n.toLocaleString('tr-TR');
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ================= Stadyum çizgisi (yuvarlak köşeli) =================
const perim = d => 4*HX + 4*HZ + 2*Math.PI*d;
function segPoint(d, i, u){
  switch(i){
    case 0: return {x:u,      z:HZ+d,  nx:0, nz:1};
    case 2: return {x:HX+d,   z:HZ-u,  nx:1, nz:0};
    case 4: return {x:HX-u,   z:-HZ-d, nx:0, nz:-1};
    case 6: return {x:-HX-d,  z:-HZ+u, nx:-1,nz:0};
    case 8: return {x:-HX+u,  z:HZ+d,  nx:0, nz:1};
    default: { const k=(i-1)/2, a=Math.PI/2 - k*Math.PI/2 - u/d, c=CORNERS[k];
      return {x:c[0]+d*Math.cos(a), z:c[1]+d*Math.sin(a), nx:Math.cos(a), nz:Math.sin(a)}; }
  }
}
function segLens(d){ const q=Math.PI*d/2; return [HX,q,2*HZ,q,2*HX,q,2*HZ,q,HX]; }
function pathPoint(d, s){
  const P = perim(d); s = ((s%P)+P)%P; const L = segLens(d);
  let i=0; while(i<8 && s>L[i]){ s-=L[i]; i++; }
  return segPoint(d, i, s);
}
function ringSamples(d, k=14){
  const out=[], L=segLens(d);
  for(let i=0;i<9;i++){
    if(i%2===0) out.push(segPoint(d,i,0));
    else for(let j=0;j<k;j++) out.push(segPoint(d,i,L[i]*j/k));
  }
  return out;
}

// ================= Sıralar =================
const SP = 0.55, AISLE = 1.2, NB = 32;
const rowPlan = d => { const P=perim(d), bl=P/NB; return {P, bl, per:Math.floor((bl-AISLE)/SP)}; };
const rows = []; { let d = 7, y = 1.2;
  for(let i=0;i<22;i++){ rows.push({d,y,kind:'alt',ri:i}); d+=0.85; y+=0.45; }
  d+=2.4; y+=2.8;
  for(let i=0;i<4;i++){ rows.push({d,y,kind:'premium',ri:i}); d+=1.15; y+=0.36; }
  d+=1.4; y+=2.4;
  for(let i=0;i<6;i++){ rows.push({d,y,kind:'mid',ri:i}); d+=0.95; y+=0.42; }
  d+=2.2; y+=2.9;
  let cnt = rows.filter(r=>r.kind==='alt').reduce((a,r)=>a+rowPlan(r.d).per*NB,0);
  for(let i=0; cnt < TRIB; i++){ rows.push({d,y,kind:'ust',ri:i}); cnt += rowPlan(d).per*NB; d+=0.85; y+=0.56; }
}
rows.forEach((r,i)=>{ r.dn = i<rows.length-1 ? rows[i+1].d : r.d+1.6; r.prevY = i? rows[i-1].y : 0; });
const LAST = rows[rows.length-1], TOPY = LAST.y, OUTD = LAST.d + 1.6;
const R_PREM = rows.filter(r=>r.kind==='premium'), R_MID = rows.filter(r=>r.kind==='mid');
const UP0 = rows.find(r=>r.kind==='ust');
const roofY = nz => TOPY + 8 + 10*nz*nz;          // eyer çatı: uzun kenarlar yüksek
const ROOF_IN = UP0.d + 5;

// ================= Koltuklar =================
const TIERNAME = {premium:'Premium Loca', mid:'Orta Loca', alt:'Alt Tribün', ust:'Üst Tribün'};
function sectorName(nx,nz){
  if(nz>0.7) return 'Maraton'; if(nz<-0.7) return 'Kapalı';
  if(nx>0.7) return 'Doğu Kale Arkası'; if(nx<-0.7) return 'Batı Kale Arkası'; return 'Köşe';
}
const boxOf = (x, side, boxes) => { const b=Math.min(boxes-1, Math.max(0, Math.floor((x+HX)/(2*HX)*boxes))); return (side>0 ? b : boxes + (boxes-1-b)) + 1; };
const prem=[], mid=[], trib=[];
let tribLeft = TRIB;
for(const r of rows){
  if(r.kind==='premium' || r.kind==='mid'){
    const totalSide = r.kind==='premium' ? PREM/2 : MID/2, nRows = r.kind==='premium' ? 4 : 6;
    const perSide = Math.floor(totalSide/nRows) + (r.ri < totalSide % nRows ? 1 : 0);
    const boxes = r.kind==='premium' ? 13 : 15;
    // koltuklar bölme içine dizilir; bölme dikmelerinin önünde boşluk kalır
    const bw = 2*HX/boxes, M = 0.45, base = Math.floor(perSide/boxes), extra = perSide % boxes;
    const order = [...Array(boxes).keys()].sort((a,b)=>Math.abs(a-(boxes-1)/2)-Math.abs(b-(boxes-1)/2));
    const xs = [];
    for(let b=0;b<boxes;b++){ const kb = base + (order.indexOf(b) < extra ? 1 : 0);
      for(let i=0;i<kb;i++) xs.push(-HX + b*bw + M + (i+0.5)*(bw-2*M)/kb); }
    for(const side of [1,-1]) for(const x of xs){
      (r.kind==='premium'?prem:mid).push({x, y:r.y, z:side*(HZ + r.d + 0.45), nx:0, nz:side, tier:r.kind,
        sector: side>0?'Maraton':'Kapalı', block:(r.kind==='premium'?'P-':'L-')+String(boxOf(x,side,boxes)).padStart(2,'0'),
        row:r.ri+1, num:0, score: Math.abs(x) + r.ri*9 + (side<0?0.3:0)});
    }
  } else {
    const {P, bl, per} = rowPlan(r.d);
    const perUse = r.kind==='ust' && per*NB > tribLeft ? Math.ceil(tribLeft/NB) : per;
    let made = 0;
    for(let b=0;b<NB;b++) for(let j=0;j<perUse;j++){
      if(made >= tribLeft) break;
      const s = b*bl + AISLE/2 + (j+0.5)*(bl-AISLE)/perUse, p = pathPoint(r.d, s);
      trib.push({x:p.x+p.nx*0.45, y:r.y, z:p.z+p.nz*0.45, nx:p.nx, nz:p.nz, tier:r.kind,
        sector:sectorName(p.nx,p.nz), block:String((r.kind==='alt'?101:201)+b), row:r.ri+1, num:j+1,
        score: Math.min(s, P-s) + r.ri*3 + (r.kind==='ust'?260:0)});
      made++;
    }
    tribLeft -= made;
  }
}
const byScore=(a,b)=>a.score-b.score;
prem.sort(byScore); mid.sort(byScore); trib.sort(byScore);
prem.forEach((s,i)=>s.num=(i%10)+1); mid.forEach((s,i)=>s.num=(i%12)+1);
const seats = [...prem, ...mid, ...trib.slice(0,TRIB)];

const CROWD = { time:{value:0}, jump:{value:1} };
function crowdMat(swayFrom){
  const m = new THREE.MeshLambertMaterial({vertexColors:true});
  m.onBeforeCompile = sh=>{
    sh.uniforms.uTime = CROWD.time; sh.uniforms.uJump = CROWD.jump;
    sh.vertexShader = 'uniform float uTime; uniform float uJump;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
        float hh = fract(sin(dot(ip.xz, vec2(12.9898,78.233))) * 43758.5453);
        float h2 = fract(hh*91.7); float ph = uTime*(6.0 + h2*2.5) + hh*6.283;
        float jj = max(0.0, sin(ph));
        transformed.y += jj*jj*0.3*uJump*(0.75+0.5*hh);
        ${swayFrom!=null ? `if(position.y > ${swayFrom.toFixed(2)}) transformed.x += sin(uTime*5.0 + hh*6.283)*0.32*(position.y-1.05)*uJump;` : ''}
      #endif`);
  };
  m.customProgramCacheKey = ()=> 'crowd'+swayFrom;
  return m;
}
function part(g, color){ g = g.index ? g.toNonIndexed() : g; if(g.attributes.uv) g.deleteAttribute('uv');
  const c=new THREE.Color(color), n=g.attributes.position.count, a=new Float32Array(n*3);
  for(let i=0;i<n;i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; } g.setAttribute('color', new THREE.BufferAttribute(a,3)); return g; }
function Bx(w,h,d,x,y,z,rx=0,rz=0){ const g=new THREE.BoxGeometry(w,h,d); if(rx) g.rotateX(rx); if(rz) g.rotateZ(rz); return g.translate(x,y,z); }
function torso(y,z){ const g=new THREE.BoxGeometry(0.38,0.5,0.22), p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const t=(p.getY(i)+0.25)/0.5; p.setX(i, p.getX(i)*(0.82+0.18*t)); } return g.translate(0,y,z); }
function head(y,z){ return [ part(new THREE.DodecahedronGeometry(0.125,0).scale(0.95,1.1,1).translate(0,y,z),'#ffffff'), part(Bx(0.25,0.09,0.27,0,y+0.12,z-0.02),HAIR) ]; }
function noBottoms(g){ // kamera hep yukarıda: aşağı bakan üçgenleri at
  const P=g.attributes.position.array, C=g.attributes.color.array, keepP=[], keepC=[], a=new THREE.Vector3(), b=new THREE.Vector3(), c=new THREE.Vector3();
  for(let i=0;i<P.length;i+=9){ a.fromArray(P,i); b.fromArray(P,i+3); c.fromArray(P,i+6);
    const n=b.clone().sub(a).cross(c.clone().sub(a)).normalize(); if(n.y < -0.9) continue;
    for(let k=0;k<9;k++){ keepP.push(P[i+k]); keepC.push(C[i+k]); } }
  const o=new THREE.BufferGeometry(); o.setAttribute('position',new THREE.Float32BufferAttribute(keepP,3)); o.setAttribute('color',new THREE.Float32BufferAttribute(keepC,3)); o.computeVertexNormals(); return o; }
function fig(shirtParts, restParts){ return { shirt: noBottoms(mergeGeometries(shirtParts.map(g=>part(g,'#ffffff')))), rest: noBottoms(mergeGeometries(restParts)) }; }

  return fig(shirt, rest);
}

const standsMesh = (function buildStands(){
  const pos=[], col=[];
  const C = {alt:new THREE.Color('#8b9198'), ust:new THREE.Color('#8b9198'), premium:new THREE.Color('#5c4416'), mid:new THREE.Color('#1c2f55'),
    riser:new THREE.Color('#5a6068'), outer:new THREE.Color('#4d545d'), front:new THREE.Color('#7a1f22')};
  const quad=(a,b,c2,dd,color)=>{ for(const p of [a,b,c2,a,c2,dd]){ pos.push(p[0],p[1],p[2]); col.push(color.r,color.g,color.b); } };
  rows.forEach((r,i)=>{
    const S = ringSamples(r.d), wa = r.dn - r.d;
    for(let k=0;k<S.length;k++){
      const a=S[k], b=S[(k+1)%S.length];
      const longSide = Math.abs(a.nz)===1 && a.nz===b.nz;
      const tc = (r.kind==='premium'||r.kind==='mid') ? (longSide ? C[r.kind] : C.alt) : C[r.kind];
      quad([a.x,r.y,a.z],[b.x,r.y,b.z],[b.x+b.nx*wa,r.y,b.z+b.nz*wa],[a.x+a.nx*wa,r.y,a.z+a.nz*wa], tc);
      quad([a.x,r.prevY,a.z],[b.x,r.prevY,b.z],[b.x,r.y,b.z],[a.x,r.y,a.z], i? C.riser : C.front);
      if(r===LAST){
        const ox=a.x+a.nx*wa, oz=a.z+a.nz*wa, px=b.x+b.nx*wa, pz=b.z+b.nz*wa;
        quad([ox,0,oz],[px,0,pz],[px,roofY(b.nz),pz],[ox,roofY(a.nz),oz], C.outer);
      }
    }
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide})); scene.add(m); return m;
})();

    for(let k=0;k<boxes;k++){

      g.font='800 54px -apple-system,Helvetica,Arial'; g.fillStyle=c;
      g.fillText((gold?'★ P-':'L-')+String(no).padStart(2,'0')+(gold?' ★':''), cx, h/2+2);
    }

function lounge(kind){
  const boxes = kind==='premium'?13:15, gold = kind==='premium';
  return tex(4096,256,(g,w,h)=>{
    const bw=w/boxes;
    for(let k=0;k<boxes;k++){
      const x0=k*bw, gr=g.createLinearGradient(0,0,0,h);
      if(gold){ gr.addColorStop(0,'#ffcf7a'); gr.addColorStop(.12,'#8a5a2b'); gr.addColorStop(1,'#3d2412'); }
      else    { gr.addColorStop(0,'#8fc4ff'); gr.addColorStop(.12,'#24406e'); gr.addColorStop(1,'#0e1a30'); }
      g.fillStyle=gr; g.fillRect(x0,0,bw,h);
      for(let p=0;p<6;p++){ g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(x0+p*bw/6, 30, 2, h-30); } // panel çizgileri
      // ekran: maç yayını
      const sw=bw*.38, sh=h*.42, sx=x0+bw*.31, sy=h*.25;
      g.fillStyle='#0b0f14'; g.fillRect(sx-6,sy-6,sw+12,sh+12);
      g.fillStyle='#2f8f45'; g.fillRect(sx,sy,sw,sh);
      g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=3; g.strokeRect(sx+8,sy+8,sw-16,sh-16);
      g.beginPath(); g.moveTo(sx+sw/2,sy+8); g.lineTo(sx+sw/2,sy+sh-8); g.stroke();
